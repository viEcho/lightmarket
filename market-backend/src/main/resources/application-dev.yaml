spring:
  devtools:
    restart:
      enabled: false
  datasource:
    username: root
    password: 123456
    # 注意8.0以上需要时区的配置
    url: jdbc:mysql://127.0.0.1:3306/market?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    #druid 数据源专有配置
    initialSize: 10
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 1 FROM DUAL
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    #配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入
    #如果允许时报错 java.lang.ClassNotFoundException: org.apache.log4j.Priority
    #则导入 log4j 依赖即可，Maven 地址： https://mvnrepository.com/artifact/log4j/log4j
    filters: stat,wall,slf4j
    maxPoolPreparedStatementPerConnectionSize: 20
    useGlobalDataSourceStat: true
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500

  # springboot3.0和flyway插件兼容性有问题，详见issue【https://github.com/spring-projects/spring-boot/issues/35124】
  flyway:
    # 开启flyway插件 - 暂时禁用，因为与MySQL 8.0存在兼容性问题
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8

    # sql 脚本的目录，默认是 classpath:db/migration
    locations: classpath:db/migration
    # 这个属性非常关键，它表示是否要清除已有库下的表
    # 如果执行的脚本是 V1__xxx.sql，那么会先清除已有库下的表，然后再执行脚本，
    # 这在开发环境下还挺方便，但是在生产环境下就要命了，而且它默认就是要清除，生产环境一定要自己配置设置为 true。
    clean-disabled: false
    # 配置数据库信息表的名称，默认是flyway_schema_history
    table: flyway_schema_history
