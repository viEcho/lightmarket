<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask 诊断工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        h2 {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .info {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .warning {
            background: #fef3c7;
            color: #92400e;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }
        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9em;
            color: #e11d48;
        }
        pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 MetaMask 连接诊断工具</h1>
        <p>这个页面帮助诊断 MetaMask 是否正确连接到 Hardhat 本地节点</p>

        <button onclick="runDiagnostics()">🔬 运行完整诊断</button>
        <button onclick="testContract()">🧪 测试 USDC 合约</button>
        <button onclick="switchToLocalhost()">🔄 切换到本地网络</button>

        <div id="results"></div>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-6.16.0.umd.min.js"></script>
    <script>
        const CONFIG = {
            USDC_ADDRESS: '0x5FbDB2315678afecb367f032d93F642f64180aa3',
            FACTORY_ADDRESS: '0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0',
            EXPECTED_CHAIN_ID: '31337'
        };

        const ERC20_ABI = [
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function balanceOf(address) view returns (uint256)"
        ];

        function addResult(type, title, content) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}</strong><br>${content}`;
            results.appendChild(div);
        }

        async function runDiagnostics() {
            document.getElementById('results').innerHTML = '';
            addResult('info', '🔬 开始诊断...', '正在收集信息...');

            // 1. 检查 MetaMask 是否安装
            if (typeof window.ethereum === 'undefined') {
                addResult('error', '❌ MetaMask 未安装', '请先安装 MetaMask 浏览器扩展');
                return;
            }
            addResult('success', '✅ MetaMask 已安装', '检测到 Web3 提供者');

            // 2. 检查是否已连接
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length === 0) {
                    addResult('warning', '⚠️ 未连接账户', '请在 MetaMask 中连接一个账户');
                } else {
                    addResult('success', '✅ 已连接账户', `地址: <code>${accounts[0]}</code>`);
                }
            } catch (error) {
                addResult('error', '❌ 获取账户失败', error.message);
                return;
            }

            // 3. 检查 Chain ID
            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                const chainIdDecimal = parseInt(chainId, 16);
                addResult('info', '🔗 当前 Chain ID',
                    `当前: <code>${chainIdDecimal}</code><br>` +
                    `需要: <code>${CONFIG.EXPECTED_CHAIN_ID}</code><br>` +
                    (chainIdDecimal === parseInt(CONFIG.EXPECTED_CHAIN_ID) ?
                        '✅ Chain ID 匹配' :
                        '❌ Chain ID 不匹配！请在 MetaMask 中切换到 Localhost 8545 网络')
                );
            } catch (error) {
                addResult('error', '❌ 获取 Chain ID 失败', error.message);
                return;
            }

            // 4. 检查网络信息（尝试获取 RPC URL）
            try {
                // 这可能在所有浏览器中都不工作，但值得一试
                const provider = new ethers.BrowserProvider(window.ethereum);
                const network = await provider.getNetwork();
                addResult('info', '🌐 网络详细信息',
                    `Chain ID: <code>${network.chainId.toString()}</code><br>` +
                    `Network Name: ${network.name || 'Unknown'}`
                );
            } catch (error) {
                addResult('warning', '⚠️ 无法获取网络详细信息', error.message);
            }

            // 5. 测试基本 RPC 连接
            try {
                const blockNumber = await window.ethereum.request({
                    method: 'eth_blockNumber',
                    params: []
                });
                addResult('success', '✅ RPC 连接正常',
                    `当前区块高度: <code>${parseInt(blockNumber, 16)}</code><br>` +
                    `说明: MetaMask 成功连接到 RPC 节点`
                );
            } catch (error) {
                addResult('error', '❌ RPC 连接失败', error.message);
                return;
            }

            // 6. 检查 Chain ID 是否匹配
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (parseInt(chainId, 16) !== parseInt(CONFIG.EXPECTED_CHAIN_ID)) {
                addResult('error', '❌ 网络不匹配',
                    `当前连接的网络 (Chain ID: ${parseInt(chainId, 16)}) 不是 Hardhat 本地网络<br>` +
                    `请在 MetaMask 中切换到 "Localhost 8545" 网络`
                );
                return;
            }

            addResult('success', '✅ 诊断完成', '基础检查通过！现在测试合约...');
            setTimeout(testContract, 500);
        }

        async function testContract() {
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (parseInt(chainId, 16) !== parseInt(CONFIG.EXPECTED_CHAIN_ID)) {
                addResult('error', '❌ 网络不匹配',
                    `请先切换到 Localhost 8545 网络 (Chain ID: ${CONFIG.EXPECTED_CHAIN_ID})`
                );
                return;
            }

            addResult('info', '🧪 测试 USDC 合约', `合约地址: <code>${CONFIG.USDC_ADDRESS}</code>`);

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const usdc = new ethers.Contract(CONFIG.USDC_ADDRESS, ERC20_ABI, provider);

                // 获取账户
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length === 0) {
                    addResult('error', '❌ 无账户', '请先在 MetaMask 中连接账户');
                    return;
                }

                // 测试 name()
                try {
                    const name = await usdc.name();
                    addResult('success', '✅ 合约可访问 - name()', `代币名称: <code>${name}</code>`);
                } catch (error) {
                    addResult('error', '❌ name() 调用失败',
                        `错误: ${error.message}<br>` +
                        `这说明合约地址 ${CONFIG.USDC_ADDRESS} 在当前网络不存在<br>` +
                        `可能原因:<br>` +
                        `1. Hardhat 节点未运行或重启了<br>` +
                        `2. MetaMask 实际连接的不是 localhost:8545<br>` +
                        `3. 合约未部署到当前网络`
                    );
                    return;
                }

                // 测试 symbol()
                try {
                    const symbol = await usdc.symbol();
                    addResult('success', '✅ 合约可访问 - symbol()', `代币符号: <code>${symbol}</code>`);
                } catch (error) {
                    addResult('warning', '⚠️ symbol() 调用失败', error.message);
                }

                // 测试 balanceOf()
                try {
                    const balance = await usdc.balanceOf(accounts[0]);
                    const formattedBalance = ethers.formatUnits(balance, 6);
                    addResult('success', '✅ 合约可访问 - balanceOf()',
                        `账户: <code>${accounts[0]}</code><br>` +
                        `余额: <code>${formattedBalance} USDC</code>`
                    );
                } catch (error) {
                    addResult('error', '❌ balanceOf() 调用失败', error.message);
                }

                addResult('success', '🎉 所有测试通过！',
                    '合约连接正常，你现在可以正常使用交易功能了'
                );

            } catch (error) {
                addResult('error', '❌ 合约测试失败', error.message);
                console.error('Contract test error:', error);
            }
        }

        async function switchToLocalhost() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x7a69' }], // 31337 in hex
                });
                addResult('success', '✅ 切换成功', '已切换到 Localhost 8545 网络，请重新运行诊断');
            } catch (error) {
                if (error.code === 4902) {
                    // 网络不存在，需要添加
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x7a69',
                                chainName: 'Localhost 8545',
                                nativeCurrency: {
                                    name: 'ETH',
                                    symbol: 'ETH',
                                    decimals: 18
                                },
                                rpcUrls: ['http://127.0.0.1:8545'],
                                blockExplorerUrls: null
                            }]
                        });
                        addResult('success', '✅ 网络已添加并切换', '已添加并切换到 Localhost 8545 网络');
                    } catch (addError) {
                        addResult('error', '❌ 添加网络失败', addError.message);
                    }
                } else {
                    addResult('error', '❌ 切换失败', error.message);
                }
            }
        }

        // 页面加载时自动运行诊断
        window.addEventListener('load', () => {
            setTimeout(runDiagnostics, 500);
        });
    </script>
</body>
</html>
